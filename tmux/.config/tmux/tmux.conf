# True color and fast Esc for NeoVim
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg escape-time 10
set -g focus-events on

set-option -g prefix M-m
unbind-key C-b
bind-key M-m send-prefix

set -g base-index 1
set -g pane-base-index 1

# Alt+1..5: switch to window without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

set -g status-left ""
set -g status-right ""
# Pseudo shadow: one step darker than the terminal background (#2E3436)
set -g status-style bg=#272c2e,fg=colour244
set -g window-status-current-style fg=colour250,bold
